<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3xp-l01t // Repo Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #0d1117;
    --border: #1e2d3d;
    --accent: #00ff88;
    --accent2: #00c8ff;
    --warn: #ff6b35;
    --dim: #3d5a73;
    --text: #c9d8e8;
    --text-dim: #4a6880;
    --folder: #00c8ff;
    --file: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,136,0.015) 2px,
      rgba(0,255,136,0.015) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  /* Header */
  header {
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--accent);
    padding: 20px 24px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, rgba(0,255,136,0.04), transparent);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    animation: scanH 3s linear infinite;
  }

  @keyframes scanH {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(0,255,136,0.4);
  }

  .repo-meta {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .repo-meta span { color: var(--accent2); }

  /* Breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(0,200,255,0.04);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    margin-bottom: 12px;
    font-size: 13px;
    overflow-x: auto;
    white-space: nowrap;
  }

  .breadcrumb-item {
    color: var(--accent2);
    cursor: pointer;
    transition: color 0.2s;
    text-decoration: underline;
    text-decoration-color: transparent;
  }

  .breadcrumb-item:hover {
    color: #fff;
    text-decoration-color: var(--accent2);
  }

  .breadcrumb-sep { color: var(--dim); }
  .breadcrumb-current { color: var(--text); }

  /* File list */
  .file-list {
    border: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px;
    padding: 10px 16px;
    background: rgba(0,200,255,0.06);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .file-item {
    display: grid;
    grid-template-columns: 24px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(30,45,61,0.5);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .file-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: rgba(0,255,136,0.06);
    transition: width 0.2s;
  }

  .file-item:hover::before { width: 100%; }

  .file-item:hover {
    border-left: 2px solid var(--accent);
    padding-left: 14px;
  }

  .file-item:hover .file-name { color: #fff; }
  .file-item:last-child { border-bottom: none; }

  .file-icon {
    font-size: 16px;
    text-align: center;
  }

  .file-name {
    font-size: 14px;
    color: var(--text);
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-name.is-dir { color: var(--folder); }
  .file-name.is-file { color: var(--file); }

  .file-time {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .dl-btn {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--text-dim);
    padding: 4px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .dl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 8px rgba(0,255,136,0.2);
  }

  /* Loading state */
  .loading {
    padding: 40px;
    text-align: center;
    color: var(--accent);
  }

  .loading::after {
    content: '';
    display: inline-block;
    width: 16px;
    animation: dots 1.5s infinite;
  }

  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  /* Error */
  .error {
    padding: 24px;
    color: var(--warn);
    border-left: 3px solid var(--warn);
    background: rgba(255,107,53,0.06);
    font-size: 13px;
  }

  /* File viewer */
  .file-viewer {
    border: 1px solid var(--border);
    margin-top: 12px;
    background: var(--panel);
  }

  .viewer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,200,255,0.04);
    font-size: 12px;
    color: var(--text-dim);
    gap: 12px;
    flex-wrap: wrap;
  }

  .viewer-header strong { color: var(--accent2); }

  .viewer-content {
    padding: 16px;
    font-size: 13px;
    line-height: 1.7;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: #adc8e0;
  }

  .viewer-content::-webkit-scrollbar { width: 4px; }
  .viewer-content::-webkit-scrollbar-track { background: var(--bg); }
  .viewer-content::-webkit-scrollbar-thumb { background: var(--dim); }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    margin-top: 12px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(0,200,255,0.03);
    flex-wrap: wrap;
    gap: 8px;
  }

  .status-bar .live {
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #000;
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: bold;
    z-index: 9999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    border-left: 4px solid #000;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .back-btn {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--text-dim);
    padding: 6px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .empty {
    padding: 32px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 600px) {
    .list-header { display: none; }
    .file-item { grid-template-columns: 24px 1fr auto; }
    .file-time { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div class="status-dot"></div>
      <h1>3XP-L01T</h1>
    </div>
    <div class="repo-meta">
      GITHUB REPO EXPLORER &nbsp;|&nbsp; BRANCH: <span>master</span> &nbsp;|&nbsp; LICENSE: <span>GPL-3.0</span>
    </div>
  </header>

  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-item" onclick="navigate('')">~ root</span>
  </div>

  <div id="back-wrap"></div>

  <div class="file-list" id="file-list">
    <div class="loading">INITIALIZING CONNECTION</div>
  </div>

  <div id="file-viewer"></div>

  <div class="status-bar">
    <span class="live"><span class="status-dot"></span> LIVE &mdash; GitHub API</span>
    <span id="status-text">Fetching repository data...</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const OWNER = '3xp-l01t';
const REPO = 'flipperzero-bruteforce'; // main repo from this user
// We'll auto-detect by listing their repos first

const API = 'https://api.github.com';
let pathStack = []; // stack of {path, name}
let currentPath = '';

const ICONS = {
  dir: '📁',
  file: '📄',
  md: '📝',
  py: '🐍',
  js: '⚡',
  json: '{}',
  txt: '📃',
  sh: '🖥',
  c: '⚙',
  h: '⚙',
  cpp: '⚙',
  bin: '🔲',
  img: '💾',
  fap: '🦭',
  sub: '📡',
  ir: '🌡',
  nfc: '🔐',
  rfid: '🏷',
};

function getIcon(item) {
  if (item.type === 'dir') return ICONS.dir;
  const ext = item.name.split('.').pop().toLowerCase();
  return ICONS[ext] || ICONS.file;
}

function getExtColor(name) {
  const ext = name.split('.').pop().toLowerCase();
  const colorMap = { md: '#e8c97a', py: '#4584b6', js: '#f0db4f', json: '#9cdcfe', sh: '#89d185' };
  return colorMap[ext] || '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(msg) {
  document.getElementById('status-text').textContent = msg;
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';

  const root = document.createElement('span');
  root.className = 'breadcrumb-item';
  root.textContent = '~ root';
  root.onclick = () => navigate('');
  bc.appendChild(root);

  pathStack.forEach((seg, i) => {
    const sep = document.createElement('span');
    sep.className = 'breadcrumb-sep';
    sep.textContent = ' / ';
    bc.appendChild(sep);

    if (i === pathStack.length - 1) {
      const cur = document.createElement('span');
      cur.className = 'breadcrumb-current';
      cur.textContent = seg.name;
      bc.appendChild(cur);
    } else {
      const item = document.createElement('span');
      item.className = 'breadcrumb-item';
      item.textContent = seg.name;
      const targetPath = pathStack.slice(0, i + 1).map(s => s.name).join('/');
      item.onclick = () => navigateToIndex(i);
      bc.appendChild(item);
    }
  });
}

function navigateToIndex(idx) {
  pathStack = pathStack.slice(0, idx + 1);
  currentPath = pathStack.map(s => s.name).join('/');
  document.getElementById('file-viewer').innerHTML = '';
  updateBreadcrumb();
  loadContents(currentPath);
}

async function navigate(path, name) {
  document.getElementById('file-viewer').innerHTML = '';
  if (path === '') {
    pathStack = [];
    currentPath = '';
  } else {
    pathStack.push({ name });
    currentPath = pathStack.map(s => s.name).join('/');
  }
  updateBreadcrumb();
  await loadContents(currentPath);
}

async function loadContents(path) {
  const fl = document.getElementById('file-list');
  const bw = document.getElementById('back-wrap');
  fl.innerHTML = '<div class="loading">FETCHING CONTENTS</div>';

  const url = path
    ? `${API}/repos/${OWNER}/${REPO}/contents/${path}`
    : `${API}/repos/${OWNER}/${REPO}/contents`;

  try {
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });

    if (!res.ok) {
      // Try to find the correct repo
      if (path === '' && REPO === 'flipperzero-bruteforce') {
        await detectAndLoad();
        return;
      }
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }

    const data = await res.json();
    setStatus(`${data.length} items in /${path || ''}`);

    // Sort: dirs first, then files
    data.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    // Back button
    bw.innerHTML = pathStack.length > 0
      ? `<button class="back-btn" onclick="goBack()">← BACK</button>`
      : '';

    if (data.length === 0) {
      fl.innerHTML = '<div class="empty">[ EMPTY DIRECTORY ]</div>';
      return;
    }

    fl.innerHTML = `
      <div class="list-header">
        <span></span>
        <span>NAME</span>
        <span>MODIFIED</span>
        <span>ACTION</span>
      </div>
    `;

    data.forEach(item => {
      const row = document.createElement('div');
      row.className = 'file-item';

      const icon = document.createElement('span');
      icon.className = 'file-icon';
      icon.textContent = getIcon(item);

      const name = document.createElement('span');
      name.className = `file-name ${item.type === 'dir' ? 'is-dir' : 'is-file'}`;
      const extColor = getExtColor(item.name);
      name.innerHTML = item.type === 'dir'
        ? `<strong>${item.name}/</strong>`
        : `<span${extColor ? ` style="color:${extColor}"` : ''}>${item.name}</span>`;

      const time = document.createElement('span');
      time.className = 'file-time';
      time.textContent = '—';

      const action = document.createElement('button');
      action.className = 'dl-btn';
      action.textContent = item.type === 'dir' ? 'ZIP ↓' : 'DL ↓';
      action.onclick = (e) => {
        e.stopPropagation();
        if (item.type === 'dir') downloadFolder(item);
        else downloadFile(item);
      };

      row.appendChild(icon);
      row.appendChild(name);
      row.appendChild(time);
      row.appendChild(action);

      if (item.type === 'dir') {
        row.onclick = () => navigate(item.path, item.name);
      } else {
        row.onclick = () => viewFile(item);
      }

      fl.appendChild(row);
    });

    // Fetch commit times async
    fetchCommitTimes(data, path);

  } catch (err) {
    fl.innerHTML = `<div class="error">⚠ CONNECTION FAILED: ${err.message}<br><br>Check CORS / rate limit. Try opening the browser console for details.</div>`;
    setStatus('Error fetching data');
  }
}

async function detectAndLoad() {
  // Try to list public repos for this user
  const fl = document.getElementById('file-list');
  fl.innerHTML = '<div class="loading">SCANNING REPOSITORIES</div>';

  try {
    const res = await fetch(`${API}/users/${OWNER}/repos?sort=updated&per_page=20`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const repos = await res.json();

    if (repos.length === 0) {
      fl.innerHTML = '<div class="empty">[ NO PUBLIC REPOS FOUND ]</div>';
      return;
    }

    // Show repo picker
    fl.innerHTML = `<div class="list-header"><span></span><span>REPOSITORY</span><span>UPDATED</span><span>ACTION</span></div>`;
    repos.forEach(r => {
      const row = document.createElement('div');
      row.className = 'file-item';
      row.innerHTML = `
        <span class="file-icon">🗂</span>
        <span class="file-name is-dir"><strong>${r.name}</strong><span style="color:var(--text-dim);font-size:11px;margin-left:8px">${r.description || ''}</span></span>
        <span class="file-time">${r.language || '—'}</span>
        <button class="dl-btn">EXPLORE</button>
      `;
      row.onclick = () => {
        window.REPO = r.name;
        Object.defineProperty(window, 'REPO', { value: r.name, writable: true });
        loadContents('');
      };
      fl.appendChild(row);
    });
    setStatus(`Found ${repos.length} repositories`);

    // Patch global REPO on click
    fl.querySelectorAll('.file-item').forEach((row, i) => {
      row.onclick = () => {
        const r = repos[i];
        // Redefine REPO
        repoName = r.name;
        pathStack = [];
        currentPath = '';
        updateBreadcrumb();
        loadContentsWithRepo('', r.full_name);
      };
    });

  } catch(e) {
    fl.innerHTML = `<div class="error">⚠ ${e.message}</div>`;
  }
}

let repoFullName = `${OWNER}/${REPO}`;

async function loadContentsWithRepo(path, fullName) {
  repoFullName = fullName;
  const fl = document.getElementById('file-list');
  fl.innerHTML = '<div class="loading">FETCHING CONTENTS</div>';

  const url = `${API}/repos/${fullName}/contents${path ? '/' + path : ''}`;
  try {
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    data.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    const bw = document.getElementById('back-wrap');
    bw.innerHTML = pathStack.length > 0 ? `<button class="back-btn" onclick="goBack()">← BACK</button>` : '';

    fl.innerHTML = `<div class="list-header"><span></span><span>NAME</span><span>TYPE</span><span>ACTION</span></div>`;
    data.forEach(item => {
      const row = document.createElement('div');
      row.className = 'file-item';
      row.innerHTML = `
        <span class="file-icon">${getIcon(item)}</span>
        <span class="file-name ${item.type === 'dir' ? 'is-dir' : 'is-file'}">${item.type === 'dir' ? `<strong>${item.name}/</strong>` : item.name}</span>
        <span class="file-time">${item.type === 'dir' ? 'DIR' : (item.size ? formatSize(item.size) : '—')}</span>
        <button class="dl-btn">${item.type === 'dir' ? 'ZIP ↓' : 'DL ↓'}</button>
      `;

      row.querySelector('.dl-btn').onclick = (e) => {
        e.stopPropagation();
        if (item.type === 'dir') downloadFolderFull(item, fullName);
        else downloadFileFull(item);
      };

      if (item.type === 'dir') {
        row.onclick = () => {
          pathStack.push({ name: item.name });
          currentPath = pathStack.map(s => s.name).join('/');
          updateBreadcrumb();
          loadContentsWithRepo(currentPath, fullName);
        };
      } else {
        row.onclick = () => viewFile(item);
      }
      fl.appendChild(row);
    });
    setStatus(`${data.length} items`);
  } catch(e) {
    fl.innerHTML = `<div class="error">⚠ ${e.message}</div>`;
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

async function fetchCommitTimes(items, path) {
  // Fetch last commit for items in batches (limited by rate)
  try {
    const url = `${API}/repos/${repoFullName}/commits?path=${path || ''}&per_page=1`;
    const res = await fetch(url);
    if (!res.ok) return;
    const commits = await res.json();
    if (commits.length > 0) {
      const date = new Date(commits[0].commit.author.date);
      const rel = timeAgo(date);
      document.querySelectorAll('.file-time').forEach(el => {
        if (el.textContent === '—') el.textContent = rel;
      });
    }
  } catch {}
}

function timeAgo(date) {
  const secs = Math.floor((Date.now() - date) / 1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs/60) + 'm ago';
  if (secs < 86400) return Math.floor(secs/3600) + 'h ago';
  if (secs < 2592000) return Math.floor(secs/86400) + 'd ago';
  if (secs < 31536000) return Math.floor(secs/2592000) + 'mo ago';
  return Math.floor(secs/31536000) + 'yr ago';
}

function goBack() {
  pathStack.pop();
  currentPath = pathStack.map(s => s.name).join('/');
  document.getElementById('file-viewer').innerHTML = '';
  updateBreadcrumb();
  if (repoFullName !== `${OWNER}/${REPO}`) {
    loadContentsWithRepo(currentPath, repoFullName);
  } else {
    loadContents(currentPath);
  }
}

async function viewFile(item) {
  const viewer = document.getElementById('file-viewer');
  viewer.innerHTML = `<div class="file-viewer"><div class="loading">LOADING FILE</div></div>`;

  try {
    const res = await fetch(item.download_url || item.url);
    if (!res.ok) throw new Error('Failed to fetch');

    const text = await res.text();
    const ext = item.name.split('.').pop().toLowerCase();
    const isBinary = ['png','jpg','jpeg','gif','bmp','bin','fap','zip','tar'].includes(ext);

    viewer.innerHTML = `
      <div class="file-viewer">
        <div class="viewer-header">
          <strong>${item.name}</strong>
          <span>${item.size ? formatSize(item.size) : ''}</span>
          <button class="dl-btn" onclick="downloadFileDirect('${item.download_url}', '${item.name}')">DOWNLOAD ↓</button>
        </div>
        <div class="viewer-content">${isBinary ? '[BINARY FILE — Use download button]' : escapeHtml(text.slice(0, 8000)) + (text.length > 8000 ? '\n\n... [TRUNCATED]' : '')}</div>
      </div>
    `;
  } catch(e) {
    viewer.innerHTML = `<div class="file-viewer"><div class="error">⚠ Cannot preview this file. Use the download button.</div></div>`;
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadFileDirect(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast(`↓ DOWNLOADING: ${name}`);
}

async function downloadFile(item) {
  if (item.download_url) {
    downloadFileDirect(item.download_url, item.name);
  } else {
    showToast('⚠ No download URL available');
  }
}

async function downloadFileFull(item) {
  downloadFile(item);
}

function downloadFolder(item) {
  // GitHub ZIP download for a folder via tree API
  const zipUrl = `https://github.com/${repoFullName}/archive/refs/heads/master.zip`;
  // For subfolders we redirect to the folder on GitHub
  const folderUrl = `https://github.com/${repoFullName}/tree/master/${item.path}`;

  showToast('↗ OPENING GITHUB — use Download ZIP');
  window.open(folderUrl, '_blank');
}

function downloadFolderFull(item, fullName) {
  const folderUrl = `https://github.com/${fullName}/tree/master/${item.path}`;
  showToast('↗ OPENING GITHUB — use Download ZIP');
  window.open(folderUrl, '_blank');
}

// Init — try the known repo structure from the screenshot
repoFullName = `${OWNER}/${REPO}`;

// Auto-detect: the screenshot shows a repo structure; let's try fetching the user's repos
(async () => {
  const res = await fetch(`${API}/users/${OWNER}/repos?sort=updated&per_page=20`).catch(() => null);
  if (!res || !res.ok) {
    loadContents('');
    return;
  }
  const repos = await res.json();
  if (repos.length === 0) { loadContents(''); return; }

  // If only one public repo or first one matches, just load it
  // Otherwise show picker
  if (repos.length === 1) {
    repoFullName = repos[0].full_name;
    loadContentsWithRepo('', repos[0].full_name);
  } else {
    // Show repo picker
    const fl = document.getElementById('file-list');
    fl.innerHTML = `<div class="list-header"><span></span><span>REPOSITORY</span><span>LANGUAGE</span><span>ACTION</span></div>`;
    repos.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'file-item';
      const nameEl = document.createElement('span');
      nameEl.className = 'file-icon';
      nameEl.textContent = '🗂';

      const fn = document.createElement('span');
      fn.className = 'file-name is-dir';
      fn.innerHTML = `<strong>${r.name}</strong><span style="color:var(--text-dim);font-size:11px;margin-left:10px">${(r.description||'').slice(0,60)}</span>`;

      const lang = document.createElement('span');
      lang.className = 'file-time';
      lang.textContent = r.language || '—';

      const btn = document.createElement('button');
      btn.className = 'dl-btn';
      btn.textContent = 'EXPLORE';

      row.appendChild(nameEl);
      row.appendChild(fn);
      row.appendChild(lang);
      row.appendChild(btn);

      const onEnter = () => {
        pathStack = [];
        currentPath = '';
        repoFullName = r.full_name;
        updateBreadcrumb();
        document.getElementById('file-viewer').innerHTML = '';
        loadContentsWithRepo('', r.full_name);
      };
      row.onclick = onEnter;
      btn.onclick = (e) => { e.stopPropagation(); onEnter(); };
      fl.appendChild(row);
    });
    setStatus(`${repos.length} repositories found for ${OWNER}`);
  }
})();
</script>
